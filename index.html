<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GCI – AI Marketing</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #1a1a2e;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
    gap: 16px;
    padding: 40px 16px;
  }
  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 8px;
  }
  .logo-icon {
    width: 44px; height: 44px;
    background: #f0e9ff;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
  }
  h1 { color: #fff; font-size: 22px; font-weight: 700; }
  p { color: #828086; font-size: 14px; margin-bottom: 12px; }
  .versions { display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 320px; }
  a.version-card {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #252540;
    border: 1px solid #35354f;
    border-radius: 14px;
    padding: 16px 20px;
    color: #fff;
    text-decoration: none;
    transition: border-color 0.2s, background 0.2s;
  }
  a.version-card:hover { background: #2e2e52; border-color: #5f2eea; }
  .version-label { font-size: 16px; font-weight: 600; }
  .version-desc { font-size: 12px; color: #828086; margin-top: 2px; }
  .version-arrow { color: #5f2eea; font-size: 18px; }
</style>
</head>
<body>
  <div class="logo">
    <div class="logo-icon">
      <svg width="24" height="24" viewBox="0 0 40 40" fill="none">
        <path d="M20 8l2.5 7.5L30 18l-7.5 2.5L20 28l-2.5-7.5L10 18l7.5-2.5L20 8z" fill="#5f2eea"/>
      </svg>
    </div>
    <h1>GCI – AI Marketing</h1>
  </div>
  <p>Select a version to preview</p>
  <div class="versions">
    <a class="version-card" href="v1/">
      <div>
        <div class="version-label">Version 1</div>
        <div class="version-desc">AI Marketing – Owner app</div>
      </div>
      <span class="version-arrow">›</span>
    </a>
    <a class="version-card" href="v2-staff/">
      <div>
        <div class="version-label">Version 2 – Staff</div>
        <div class="version-desc">Staff-facing feature</div>
      </div>
      <span class="version-arrow">›</span>
    </a>
    <a class="version-card" href="v3-no-chatbot/">
      <div>
        <div class="version-label">Version 3 – No Chatbot</div>
        <div class="version-desc">v1 variant without AI chatbot</div>
      </div>
      <span class="version-arrow">›</span>
    </a>
    <a class="version-card" href="v4/">
      <div>
        <div class="version-label">Version 4</div>
        <div class="version-desc">Draggable chatbot, tap to show suggestion chips</div>
      </div>
      <span class="version-arrow">›</span>
    </a>
    <a class="version-card" href="v5-multiple-store/">
      <div>
        <div class="version-label">Version 5 – Multiple Store</div>
        <div class="version-desc">Multi-store support</div>
      </div>
      <span class="version-arrow">›</span>
    </a>
  </div>
</body>
</html>
